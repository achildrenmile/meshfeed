<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="4"/>

  <!-- Signal waves (sky blue brand accent) -->
  <g fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <path d="M 78 78 Q 58 98 78 118" opacity="0.95"/>
    <path d="M 58 62 Q 28 98 58 134" opacity="0.65"/>
    <path d="M 178 78 Q 198 98 178 118" opacity="0.95"/>
    <path d="M 198 62 Q 228 98 198 134" opacity="0.65"/>
  </g>

  <!-- Tower structure -->
  <g fill="url(#towerGrad)" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round">
    <circle cx="128" cy="58" r="8" fill="#38bdf8" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="125" y="64" width="6" height="14" rx="1"/>
    <path d="M 108 200 L 148 200 L 140 78 L 116 78 Z"/>
    <g stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="116" y1="96" x2="140" y2="96"/>
      <line x1="115" y1="120" x2="141" y2="120"/>
      <line x1="113" y1="148" x2="143" y2="148"/>
      <line x1="111" y1="176" x2="145" y2="176"/>
      <line x1="116" y1="78" x2="140" y2="96"/>
      <line x1="140" y1="78" x2="116" y2="96"/>
      <line x1="116" y1="96" x2="141" y2="120"/>
      <line x1="140" y1="96" x2="115" y2="120"/>
      <line x1="115" y1="120" x2="143" y2="148"/>
      <line x1="141" y1="120" x2="113" y2="148"/>
      <line x1="113" y1="148" x2="145" y2="176"/>
      <line x1="143" y1="148" x2="111" y2="176"/>
    </g>
  </g>

  <rect x="96" y="200" width="64" height="10" rx="2" fill="#475569"/>
  <rect x="88" y="210" width="80" height="6" rx="1" fill="#334155"/>

  <text x="128" y="236" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#0ea5e9" text-anchor="middle" letter-spacing="1">QRV</text>
</svg>
